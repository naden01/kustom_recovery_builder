name: OrangeFox [OFRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
        - 16.0
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://gitlab.com/naden01/LH8n.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox_14.1'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/tecno/LH8n'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'LH8n'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
      continue-on-error: true

    - name: Notify Telegram — Build Started
      run: |
          chmod +x .github/scripts/send_to_telegram.sh
          .github/scripts/send_to_telegram.sh \
            "notify" \
            "${{ github.event.inputs.DEVICE_NAME }}" \
            "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            "" \
            "" \
            "" \
            "" \
            "${{ secrets.TELEGRAM_CHAT_ID }}" \
            "${{ secrets.TELEGRAM_TOKEN }}" \
            "${{ github.workflow }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "" \
            ""
            
    - name: Set-up Manifest
      if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1' || github.event.inputs.MANIFEST_BRANCH == '16.0'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "naden01"
        git config --global user.email "naden.irsyad01@gmail.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      continue-on-error: true
       
    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
      continue-on-error: true
        
    - name: Check Manifest Branch
      run: |
        if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "16.0" ]; then
            echo "LUNCH_CMD=lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-bp2a-eng && mka ${{ github.event.inputs.BUILD_TARGET }}image" >> $GITHUB_ENV
        elif [ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "11.0" ] || [ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "12.1" ] || [ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "14.1" ]; then
            echo "LUNCH_CMD=lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-ap2a-eng && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image" >> $GITHUB_ENV
        else
            echo "LUNCH_CMD=lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && mka ${{ github.event.inputs.BUILD_TARGET }}image" >> $GITHUB_ENV
        fi
      continue-on-error: true
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-
      continue-on-error: true
    - name: Building OrangeFox
      env:
        USE_CCACHE: "1"
        CCACHE_EXEC: /usr/bin/ccache
        CCACHE_DIR: /home/runner/.ccache
        CCACHE_MAXSIZE: "4G"
        CCACHE_COMPRESS: "1"
        CCACHE_COMPILERCHECK: "content"
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        eval "${LUNCH_CMD}"
      continue-on-error: true
      
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
      continue-on-error: true

    - name: Set Build Date # For Build Date Info, currently using Asia/Manila
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Recovery out directory is empty."
        fi
        if [ -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip ]; then
            echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Recovery out directory is empty."
        fi
      continue-on-error: true
      
    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true' && env.CHECK_ZIP_IS_OK == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}
          MD5 (zip): ${{ env.MD5_ZIP }}
      continue-on-error: true
        
    - name: Run LDCheck
      if: github.event.inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        cd ../OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true

    - name: Notify Telegram — Build Done
      if: success()
      run: |
        .github/scripts/send_to_telegram.sh \
          "release" \
          "${{ github.event.inputs.DEVICE_NAME }}" \
          "${{ github.event.inputs.MANIFEST_BRANCH }}" \
          "${{ env.BUILD_DATE }}" \
          "${{ env.COMMIT_ID }}" \
          "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.run_id }}" \
          "${{ env.CLEAN_DEVICE_TREE }}" \
          "${{ secrets.TELEGRAM_CHAT_ID }}" \
          "${{ secrets.TELEGRAM_TOKEN }}" \
          "${{ github.workflow }}" \
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          "${{ secrets.GITHUB_TOKEN }}" \
          "${{ github.repository }}" \
          "${{ github.run_id }}"
